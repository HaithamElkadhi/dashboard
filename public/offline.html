<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173B65">
  <title>JEEXPERT — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F4F7FB; color: #172D43; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid #D9E2EC; border-radius: 12px; background: white; }
    .brand { color: #173B65; font-weight: 700; letter-spacing: 2px; }
    h1 { font-size: 24px; }
    p { line-height: 1.6; }
    button { min-height: 44px; padding: 12px 20px; border: 0; border-radius: 8px; color: white; background: #173B65; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #80C4EA; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">JEEXPERT</div>
    <h1>You’re offline</h1>
    <p>Connect to the internet to access your dashboard and the latest student data.</p>
    <button onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
